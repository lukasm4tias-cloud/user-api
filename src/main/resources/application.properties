
spring.application.name=user-api

# Porta da aplica\u00e7\u00e3o
server.port=8080

# Pool de conex\u00f5es
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/user_api_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Schema utilizado pela aplica\u00e7\u00e3o e pelo Flyway
spring.flyway.schemas=users
spring.jpa.properties.hibernate.default_schema=users

# Gerenciamento das tabelas
spring.jpa.hibernate.ddl-auto=validate
